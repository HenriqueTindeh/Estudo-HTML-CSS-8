
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree - Henrique Tindé</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">
        <div class="container-imagem">
            <div class="imagem"></div>
            <p><b>Henrique "Tindé"</b></p>
        </div>

        <div class="container-botao">
            
            <div class="botao" onclick="window.open('https://www.instagram.com/tindersemr/', '_blank')">
                <i class="fa-brands fa-instagram"></i>
                <p>Instagram</p>
            </div>

            <div class="botao" onclick="window.open('https://wa.me/5514998934000', '_blank')">
                <i class="fa-brands fa-whatsapp"></i>
                <p>Whatsapp</p>
            </div>
            
            <div class="botao" onclick="window.open('https://www.linkedin.com/in/lhsj/', '_blank')">
                <i class="fa-brands fa-linkedin-in"></i>
                <p>LinkedIn</p>
            </div>
        </div>
    </div>

</body>
</html>
